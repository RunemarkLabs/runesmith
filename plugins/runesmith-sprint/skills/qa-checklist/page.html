<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm work tool, read on a phone between other work.
   IDEA: an inspection tag clipped to each item, punched pass or fail.
   PICTURE: the checklist itself; the summary tag on top, then one card per item.
   COLOUR and TYPE: white ground, ink, signal green for passed, red for failing, amber for left; Space Grotesk titles, Inter body.
   LAYOUT: one column up to 760px; buttons full width on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d1014);--ink:light-dark(#0b0b10,#eceff3);--soft:light-dark(#5b6270,#9aa3b2);
--line:light-dark(#e3e6eb,#252a33);--card:light-dark(#ffffff,#141820);
--pass:light-dark(#00a862,#2bd48a);--passbg:light-dark(#eafaf2,#0f2a1e);
--fail:light-dark(#d4263e,#ff5a70);--failbg:light-dark(#fdecef,#2d1218);
--left:light-dark(#b26b00,#f0b245);--leftbg:light-dark(#fff6e6,#2a2010)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
main{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,14px) 64px}
h1{font:600 clamp(28px,6vw,40px)/1.05 "Space Grotesk",Inter,sans-serif;margin:0 0 6px;text-wrap:balance}
h2{font:600 19px/1.25 "Space Grotesk",Inter,sans-serif;margin:0}
.sub{color:var(--soft);margin:0 0 22px}
.tag{border:2px solid var(--ink);border-radius:14px;padding:18px 20px;margin-bottom:22px;position:relative}
.tag::before{content:"";position:absolute;top:16px;right:18px;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.count{font:600 clamp(36px,9vw,56px)/1 "Space Grotesk",Inter,sans-serif;margin:6px 0 8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:10px 0 12px}
.bar i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--soft);font-size:14px}
.left-list{margin:10px 0 0;padding-left:20px}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--left);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.item.passed{border-left-color:var(--pass)}.item.failing{border-left-color:var(--fail)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.build{color:var(--soft);font-size:14px;white-space:nowrap}
.label{font-weight:600;margin:12px 0 4px}
ol,ul{margin:0;padding-left:22px}li{margin:2px 0}
code{font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--line);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.checker{color:var(--soft);font-size:14px;margin-top:12px}
.state{display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;margin-top:10px;background:var(--leftbg);color:var(--left)}
.passed .state{background:var(--passbg);color:var(--pass)}.failing .state{background:var(--failbg);color:var(--fail)}
.note{margin-top:8px;font-size:15px;white-space:pre-wrap}
.shot{display:block;max-width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--line)}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:600 16px Inter,sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:2px solid transparent;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--left);outline-offset:2px}
.pass{background:var(--pass);color:#fff}.fail{background:var(--fail);color:#fff}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
button[disabled]{opacity:.5;cursor:default}
.msg{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--soft)}
dialog{border:0;border-radius:14px;padding:20px;width:min(520px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgb(0 0 0/.45)}
textarea{width:100%;min-height:120px;font:16px/1.5 Inter,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=file]{font-size:16px;margin-top:10px;max-width:100%}
.err{color:var(--fail);font-size:14px;min-height:20px;margin-top:6px}
@media(max-width:600px){.actions button{flex:1 1 0}}
@media(prefers-reduced-motion:no-preference){.item{transition:border-color .2s}}
</style>
</head>
<body>
<main>
  <h1 id="title">QA checklist</h1>
  <p class="sub" id="sub">Loading the checklist.</p>
  <section id="summary"></section>
  <section id="items"></section>
</main>

<dialog id="failDlg">
  <form id="failForm">
    <h2 id="failTitle">What did you see?</h2>
    <p class="sub" style="margin:6px 0 10px">A short description is enough. It becomes the fix task and the bug report.</p>
    <textarea id="failNote" required></textarea>
    <div id="shotWrap"><label for="failShot" class="label" style="display:block">Screenshot (optional)</label><input type="file" id="failShot" accept="image/*"></div>
    <div class="err" id="failErr"></div>
    <div class="actions">
      <button type="submit" class="fail" id="failSave">Mark failing</button>
      <button type="button" class="ghost" id="failCancel">Cancel</button>
    </div>
  </form>
</dialog>

<script>
{
  // Data model (written by the planner with db_write; never hardcoded here):
  //   checklist/current  {project, build, target, items:[{key,title,build,steps[],expect[],checker}]}
  //   results/{key}      {state:"passed"|"failing", note, shot, build, at}
  const el = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const txt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  let db = null, assets = null, canWrite = true;
  let list = null, results = {}, failingKey = null, busy = new Set();

  function render() {
    if (!list) return;
    const items = Array.isArray(list.items) ? list.items : [];
    el("title").textContent = (list.project ? list.project + " " : "") + "QA checklist";
    el("sub").textContent = "Build " + (list.build || "?") + " is on qa. Test these before it goes to " + (list.target || "beta") + ". Press Passes or Failing on each.";
    const st = k => results[k]?.state || "left";
    const passed = items.filter(i => st(i.key) === "passed").length;
    const failing = items.filter(i => st(i.key) === "failing").length;
    const left = items.length - passed - failing;
    const pct = n => items.length ? (n / items.length * 100) + "%" : "0";
    const leftTitles = items.filter(i => st(i.key) === "left").map(i => "<li>" + esc(i.title) + "</li>").join("");
    el("summary").innerHTML = items.length ? `
      <div class="tag">
        <div>Build ${esc(list.build)}</div>
        <div class="count">${passed} of ${items.length} passed</div>
        <div class="bar" aria-hidden="true"><i style="width:${pct(passed)};background:var(--pass)"></i><i style="width:${pct(failing)};background:var(--fail)"></i><i style="width:${pct(left)};background:var(--left)"></i></div>
        <div class="legend"><span>${passed} passed</span><span>${failing} failing</span><span>${left} left to test</span></div>
        ${left ? `<ol class="left-list">${leftTitles}</ol>` : `<p style="margin:10px 0 0">${failing ? "Failing items go back to Claude Code as fix tasks." : "Everything passed. Tell the planner to check comms."}</p>`}
      </div>` : `<div class="msg">Nothing needs your eyes for build ${esc(list.build)}. Every item was checked automatically.</div>`;
    el("items").innerHTML = items.map(i => {
      const r = results[i.key] || {}, s = st(i.key);
      const label = s === "passed" ? "Passed" : s === "failing" ? "Failing" : "Not tested yet";
      const shot = r.shot ? `<img class="shot" alt="Screenshot of the failure" src="/_blob/${esc(r.shot)}">` : "";
      const dis = (!canWrite || busy.has(i.key)) ? " disabled" : "";
      return `<article class="item ${s}" id="item-${esc(i.key)}">
        <div class="head"><h2>${esc(i.title)}</h2><span class="build">${esc(i.build || list.build)}</span></div>
        <div class="label">Steps</div><ol>${(i.steps || []).map(x => "<li>" + txt(x) + "</li>").join("")}</ol>
        <div class="label">Expect</div><ul>${(i.expect || []).map(x => "<li>" + txt(x) + "</li>").join("")}</ul>
        <div class="checker">${txt(i.checker)}</div>
        <span class="state">${label}</span>
        ${s === "failing" && r.note ? `<div class="note">${esc(r.note)}</div>${shot}` : ""}
        <div class="actions">
          ${s !== "passed" ? `<button class="pass" data-pass="${esc(i.key)}"${dis}>Passes</button>` : ""}
          ${s !== "failing" ? `<button class="fail" data-fail="${esc(i.key)}"${dis}>Failing</button>` : ""}
          ${s !== "left" ? `<button class="ghost" data-reset="${esc(i.key)}"${dis}>Undo</button>` : ""}
        </div></article>`;
    }).join("");
  }

  async function save(key, body) {
    if (!db || busy.has(key)) return;
    busy.add(key); render();
    try {
      if (body) await db.doc("results/" + key).set({ ...body, build: list.build, at: new Date().toISOString() });
      else await db.doc("results/" + key).delete();
    } catch (e) {
      if (e && e.code === "invalid_argument") { canWrite = false; el("sub").textContent = "You can view this checklist but not change it."; }
      else el("sub").textContent = "That didn't save. Try again in a moment.";
    } finally { busy.delete(key); render(); }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.pass) save(b.dataset.pass, { state: "passed" });
    if (b.dataset.reset) save(b.dataset.reset, null);
    if (b.dataset.fail) {
      failingKey = b.dataset.fail;
      const it = (list.items || []).find(i => i.key === failingKey);
      el("failTitle").textContent = "What did you see? " + (it ? it.title : "");
      el("failNote").value = results[failingKey]?.note || ""; el("failShot").value = ""; el("failErr").textContent = "";
      el("shotWrap").hidden = !assets;
      el("failDlg").showModal(); el("failNote").focus();
    }
  });
  el("failCancel").addEventListener("click", () => el("failDlg").close());
  el("failForm").addEventListener("submit", async e => {
    e.preventDefault();
    const note = el("failNote").value.trim();
    if (!note) { el("failErr").textContent = "Say what you saw, in a sentence or two."; return; }
    let shot = null; const f = el("failShot").files[0];
    el("failSave").disabled = true;
    try { if (f && assets) shot = (await assets.upload(f)).id; }
    catch { el("failErr").textContent = "The screenshot didn't upload. Saving the description without it."; }
    el("failSave").disabled = false; el("failDlg").close();
    save(failingKey, { state: "failing", note, shot });
  });

  (async () => {
    db = await claude.use("db"); assets = await claude.use("assets");
    const user = await claude.use("user");
    if (user && typeof user.can === "function") { try { const c = await user.can("data.write"); if (c === false) canWrite = false; } catch {} }
    if (!db) { el("sub").textContent = "Sign in to see the checklist."; return; }
    const timer = setTimeout(() => { if (!list) el("sub").textContent = "The checklist can't be reached yet. It will appear when the connection returns."; }, 10000);
    db.doc("checklist/current").onSnapshot(s => {
      if (!s.metadata.fromCache) clearTimeout(timer);
      if (!s.exists) { el("sub").textContent = "No checklist yet. The planner publishes it when a build is promoted to qa."; el("summary").innerHTML = ""; el("items").innerHTML = ""; return; }
      list = s.data(); render();
    }, () => { clearTimeout(timer); el("sub").textContent = "The checklist can't be loaded on this view."; });
    db.collection("results").onSnapshot(q => { const r = {}; q.docs.forEach(d => { r[d.id] = d.data(); }); results = r; render(); }, () => {});
  })();
}
</script>
</body>
</html>
